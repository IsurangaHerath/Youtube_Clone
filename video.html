<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <style>
    body {
      font-family: Roboto, Arial, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    a { color: #3ea6ff; }
  </style>
  <script>
    // Legacy redirect: old links like video.html?id=5 now jump to the
    // single-page app's watch route so they keep working.
    var id = new URLSearchParams(window.location.search).get('id');
    var hash = id ? '#/watch/' + id : '#/';
    window.location.replace('./index.html' + hash);
  </script>
</head>
<body>
  <p>Redirecting to <a href="./index.html#/">the player</a>...</p>
</body>
</html>
